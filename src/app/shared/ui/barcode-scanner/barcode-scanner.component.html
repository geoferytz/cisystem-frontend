<cis-modal [open]="open" [title]="title" maxWidthClass="max-w-md" (close)="requestClose()">
  <div class="scanner-body">
    <video #preview class="scanner-video" playsinline muted autoplay></video>
    @if (status === 'starting' || status === 'scanning') {
      <div class="scanner-overlay" aria-hidden="true"><span class="scanner-frame"></span></div>
    }
  </div>
  @if (status === 'starting') {
    <p class="scanner-status" role="status">Starting camera…</p>
  }
  @if (status === 'scanning') {
    <p class="scanner-status" role="status">Point the camera at the product barcode.</p>
  }
  @if (status === 'error') {
    <p class="scanner-error" role="alert">{{ errorMessage }}</p>
  }
  <div class="scanner-actions">
    <button type="button" class="rounded-xl bg-slate-100 px-4 py-2 text-sm font-semibold text-slate-800 hover:bg-slate-200 dark:bg-slate-700 dark:text-slate-200 dark:hover:bg-slate-600" (click)="requestClose()">Cancel</button>
  </div>
</cis-modal>
