<div *ngIf="open" class="cis-modal-overlay fixed inset-0 z-50" (click)="onBackdropClick()" (keydown.escape)="$event.stopPropagation(); close.emit()">
  <div class="absolute inset-0 bg-slate-900/40"></div>
  <div class="absolute inset-0 flex items-center justify-center p-4">
    <div
      class="w-full rounded-2xl bg-white dark:bg-slate-800 p-5 shadow-xl ring-1 ring-slate-200 dark:ring-slate-700"
      role="dialog"
      aria-modal="true"
      [attr.aria-label]="title || 'Dialog'"
      cdkTrapFocus
      [cdkTrapFocusAutoCapture]="true"
      [ngClass]="maxWidthClass"
      (click)="onDialogClick($event)"
    >
      <div class="flex items-start justify-between gap-3" *ngIf="title">
        <div class="text-base font-semibold text-slate-900 dark:text-slate-100">{{ title }}</div>
        <button type="button" class="rounded-xl bg-slate-100 dark:bg-slate-700 px-3 py-2 text-sm font-semibold text-slate-800 dark:text-slate-200" (click)="close.emit()" aria-label="Close dialog" cdkFocusInitial>✕</button>
      </div>

      <div [ngClass]="title ? 'mt-4' : ''">
        <ng-content />
      </div>
    </div>
  </div>
</div>
