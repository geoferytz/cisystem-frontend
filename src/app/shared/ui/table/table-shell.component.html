<div class="cis-table-surface rounded-2xl bg-white dark:bg-slate-800 p-4 shadow-sm ring-1 ring-slate-100 dark:ring-slate-700">
  @if (title || subtitle) {
    <div class="flex flex-wrap items-start justify-between gap-3">
      <div>
        @if (title) {
          <div class="text-base font-semibold text-slate-900">{{ title }}</div>
        }
        @if (subtitle) {
          <div class="mt-1 text-xs text-slate-500">{{ subtitle }}</div>
        }
      </div>
      <ng-content select="[actions]" />
    </div>
  }

  <div class="cis-table-content" [ngClass]="(title || subtitle) ? 'mt-3' : ''">
    @if (!empty) {
      <ng-content />
    } @else {
      <div class="rounded-xl bg-slate-50 p-4 text-sm text-slate-600 ring-1 ring-slate-100">{{ emptyMessage }}</div>
    }
  </div>
</div>
