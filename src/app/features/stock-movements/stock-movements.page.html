<div class="flex items-center">
  <h2 class="text-xl font-semibold text-slate-900 dark:text-slate-100">Stock Movements</h2>
</div>

<!-- Out of stock products -->
<div class="mt-4 rounded-2xl bg-white dark:bg-slate-800 p-4 shadow-sm ring-1 ring-slate-100 dark:ring-slate-700">
  <div class="flex flex-wrap items-center justify-between gap-2">
    <h3 class="text-sm font-semibold text-slate-900 dark:text-slate-100">{{ 'productDashboard.outOfStock' | translate }}</h3>
    <span class="rounded-full bg-red-50 dark:bg-red-900/30 px-3 py-1 text-xs font-bold text-[#B81104] dark:text-red-400">{{ oosFiltered().length }}</span>
  </div>

  <form class="mt-3 grid gap-3 sm:grid-cols-[240px_240px] sm:items-end" [formGroup]="oosFilterForm">
    <cis-form-fields [form]="oosFilterForm" [fields]="oosFilterFields" />
  </form>

  <div class="mt-3 text-sm text-[#B81104] dark:text-red-400" *ngIf="oosError()">{{ oosError() }}</div>

  <div class="mt-3">
    <cis-data-table [columns]="oosCols" [rows]="oosFiltered()" [loading]="oosLoading()">
      <ng-template cisCell="qtyOnHand" let-row>
        <span class="font-semibold text-[#B81104] dark:text-red-400">{{ row.qtyOnHand }}</span>
      </ng-template>
      <ng-template cisCell="status" let-row>
        <span class="rounded-full bg-red-50 dark:bg-red-900/30 px-2 py-0.5 text-xs font-semibold text-[#B81104] dark:text-red-400">
          {{ 'productDashboard.outOfStock' | translate }}
        </span>
      </ng-template>
    </cis-data-table>
  </div>
</div>

<div class="mt-4 rounded-2xl bg-white dark:bg-slate-800 p-4 shadow-sm ring-1 ring-slate-100 dark:ring-slate-700">
  <form class="grid gap-3 sm:grid-cols-[240px_auto] sm:items-end" [formGroup]="filterForm" (ngSubmit)="load()">
    <cis-form-fields [form]="filterForm" [fields]="movementFilterFields" />
    <button class="rounded-xl bg-pink-500 px-4 py-2 text-sm font-semibold text-white" type="submit">
      {{ 'common.apply' | translate }}
    </button>
  </form>

  <div class="mt-3 text-sm text-[#B81104] dark:text-red-400" *ngIf="error()">{{ error() }}</div>

  <div class="mt-3">
    <cis-data-table [columns]="movementCols" [rows]="items()" [loading]="loading()" />
  </div>
</div>
